{% extends "base.html" %}

{% block content %}
{% if step == 1 %}
  <h2>Reset your password</h2>
  <form method="post">
    {% csrf_token %}
    {{form.as_p}}
    <button type="submit">Confirm</button>
  </form>
{% elif  step == 2%}
  <p>
    If an account is associated with this email, we'll send
    a password reset link.
  </p>
{% endif %}

{% endblock content %}
