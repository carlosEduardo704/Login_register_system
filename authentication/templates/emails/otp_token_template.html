<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Código de Verificação</title>
</head>

<body
  style="margin: 0; padding: 0; background-color: #f8f9fa; font-family: 'Roboto', Arial, sans-serif; color: #333333;">

  <table border="0" cellpadding="0" cellspacing="0" width="100%"
    style="table-layout: fixed; background-color: #f8f9fa; padding: 40px 0;">
    <tr>
      <td align="center">
        
        <div style="font-size: 20px; font-weight: 400; color: #333333; margin-bottom: 30px;">
          Authentication Code
        </div>

        
        <table border="0" cellpadding="0" cellspacing="0" width="440"
          style="background: #ffffff; border-radius: 4px; box-shadow: 0 15px 30px 0 rgba(0, 0, 0, 0.05); padding: 40px 50px; text-align: center;">
          <tr>
            <td align="center">
              
              <table border="0" cellpadding="0" cellspacing="0" width="70" height="70"
                style="background-color: #007bff; border-radius: 50%; margin: 0 auto 20px auto;">
                <tr>
                  <td align="center" valign="middle"
                    style="color: #ffffff; font-size: 24px; font-family: Arial, sans-serif;">
                    🔒
                  </td>
                </tr>
              </table>

              
              <h3 style="font-size: 22px; font-weight: 400; color: #333333; margin: 0 0 15px 0;">
                Verify Your Identity
              </h3>

              
              <p style="font-size: 14px; color: #6c757d; margin: 0 0 25px 0; line-height: 1.5;">
                Use the security code below to complete your authentication process. This code expires in 5 minutes.
              </p>

              
              <div
                style="width: 100%; background-color: #f8f9fa; border: 1px solid #e1e1e1; border-radius: 4px; padding: 15px; font-size: 28px; font-weight: 500; letter-spacing: 6px; color: #007bff; margin-bottom: 25px;">
                {{ otp_token }}
              </div>

              <p style="font-size: 13px; color: #999999; margin: 0; line-height: 1.4;">
                If you didn't request this code, you can safely ignore this email.
              </p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>

</html>
