{% extends "base.html" %}
{% block content %}
  <h1>Welcome back!</h1>
  <p>Type your email and password!</p>

  <form id="loginForm">
    {% csrf_token %}
      <div class="form-group">
          {{form.as_p}}
      </div>
      
      <button type="submit">Log In</button>
  </form>
  <div class="link">
    <a href="{% url 'forget_password' %}">Forgot Password?</a>
    <p>Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p> 
  </div>
{% endblock %}
